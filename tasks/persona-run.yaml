---
# persona-run -- second of the three persona-run tasks (stuttgart-things/ai-personas).
#
# One `claude -p` run of a persona against a scenario, in the ai-personas
# runner image with its unchanged entrypoint (persona-run). The image has only
# claude, claims, curl, jq, js-yaml and ssh -- no kubectl, gh, git or vault.
#
# Credentials: the first step moves the persona token and the SSH key from the
# credentials workspace into memory-backed emptyDirs and deletes them from the
# volume; the run step reads the token into its environment and deletes the
# file before claude starts. The Claude credential (API key or OAuth token)
# comes from a Secret.
#
# The entrypoint checks the output for every credential at the end; on a hit it
# deletes the output and exits 3, so this task fails and nothing is published.
#
# This pod should get a NetworkPolicy (label tekton.dev/pipelineTask=run):
# egress only to DNS, claim-machinery-api, machinery-order-service, ZITADEL,
# the Anthropic API and -- for ssh scenarios -- the lab's VM network. The
# egress-check step proves the negative before claude starts: every URL in
# EGRESS_DENIED (Vault, GitHub) must be unreachable from this pod, otherwise
# the task fails and no persona runs (ai-personas ADR 0006).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: persona-run
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/categories: "testing"
    tekton.dev/tags: "ai-personas,claude"
spec:
  description: >-
    Run one ai-personas persona against one scenario with claude -p, using only
    the persona's short-lived token. Writes transcript.jsonl, transcript.md,
    friction.txt and summary.json to output/<RUN_ID>.
  workspaces:
    - name: credentials
      description: persona-token (+ ssh/) from persona-credentials; emptied by this task
    - name: output
      description: the run's report lands in <output>/<RUN_ID>/
    - name: ca-certs
      optional: true
      mountPath: /etc/ssl/extra
      description: the lab's root CA as key `ca.pem`, added to the roots for claims, curl and claude
  params:
    - name: PERSONA
      type: string
    - name: SCENARIO
      type: string
    - name: RUN_ID
      type: string
      description: from persona-credentials (result run-id)
    - name: LAB
      type: string
    - name: CLAIM_API_URL
      type: string
      description: claim-machinery-api of the lab
    - name: ORDER_API_URL
      type: string
      description: machinery-order-service of the lab
    - name: RUNNER_IMAGE
      type: string
      description: the ai-personas runner image
    - name: EGRESS_DENIED
      type: string
      default: ""
      description: >-
        space-separated URLs this pod must not reach (e.g. the Vault address
        and https://github.com); empty skips the check
    - name: anthropic-secret-name
      type: string
      default: "anthropic"
      description: >-
        Secret whose keys become claude's environment: ANTHROPIC_API_KEY (API
        key, for regular CI) or CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`,
        one person's subscription; test phase only). Put nothing else in it.
  volumes:
    - name: persona-token
      emptyDir:
        medium: Memory
        sizeLimit: 1Mi
    - name: persona-ssh
      emptyDir:
        medium: Memory
        sizeLimit: 1Mi
  stepTemplate:
    image: "$(params.RUNNER_IMAGE)"
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      allowPrivilegeEscalation: false
    volumeMounts:
      - name: persona-token
        mountPath: /run/persona-token
      - name: persona-ssh
        mountPath: /run/persona-ssh
  steps:
    - name: stage-credentials
      env:
        - name: CRED_DIR
          value: $(workspaces.credentials.path)
      computeResources:
        requests:
          cpu: 10m
          memory: 16Mi
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        umask 077
        [ -s "$CRED_DIR/persona-token" ] || { echo "no persona token on the credentials workspace" >&2; exit 1; }
        cp "$CRED_DIR/persona-token" /run/persona-token/token
        if [ -s "$CRED_DIR/ssh/id_ed25519" ]; then
          cp "$CRED_DIR/ssh/id_ed25519" "$CRED_DIR/ssh/id_ed25519-cert.pub" /run/persona-ssh/
          echo "ssh key staged"
        fi
        # Off the volume before the persona exists.
        rm -rf "${CRED_DIR:?}"/persona-token "${CRED_DIR:?}"/ssh

    - name: egress-check
      env:
        - name: EGRESS_DENIED
          value: $(params.EGRESS_DENIED)
      computeResources:
        requests:
          cpu: 10m
          memory: 16Mi
      script: |
        #!/usr/bin/env bash
        # Blocked = no connection at all: curl 6 (no DNS answer), 7 (refused),
        # 28 (timeout; the policy drops the packets). Anything else, a TLS
        # error included, means a TCP connection got through.
        set -uo pipefail
        [ -n "${EGRESS_DENIED// }" ] || { echo "egress check skipped (EGRESS_DENIED empty)"; exit 0; }
        bad=0
        for u in $EGRESS_DENIED; do
          curl -sS -o /dev/null --connect-timeout 5 --max-time 8 "$u" 2>/dev/null; rc=$?
          case $rc in
            6|7|28) echo "blocked: $u (curl $rc)" ;;
            *) echo "REACHABLE: $u (curl $rc)" >&2; bad=1 ;;
          esac
        done
        [ $bad -eq 0 ] || { echo "this pod reaches what it must not; no persona run" >&2; exit 1; }

    - name: run
      env:
        - name: PERSONA
          value: $(params.PERSONA)
        - name: SCENARIO
          value: $(params.SCENARIO)
        - name: RUN_ID
          value: $(params.RUN_ID)
        - name: LAB
          value: $(params.LAB)
        - name: CLAIM_API_URL
          value: $(params.CLAIM_API_URL)
        - name: CLAIM_ORDERS_URL
          value: $(params.ORDER_API_URL)
        - name: OUT_DIR
          value: $(workspaces.output.path)
        - name: HOME
          value: /tmp/persona-home
        # No telemetry, error reporting or auto-update calls: the egress policy
        # only has to allow the Anthropic API itself.
        - name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
          value: "1"
      # ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN, whichever the Secret
      # holds; the entrypoint takes either and checks both in its leak check.
      envFrom:
        - secretRef:
            name: $(params.anthropic-secret-name)
      # Requests only: claude + node + the persona's tool calls vary a lot.
      computeResources:
        requests:
          cpu: 250m
          memory: 512Mi
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        mkdir -p "$HOME"
        PERSONA_TOKEN=$(cat /run/persona-token/token)
        rm -f /run/persona-token/token
        export PERSONA_TOKEN
        exec persona-run "$PERSONA" "$SCENARIO"
