---
# persona-credentials -- first of the three persona-run tasks
# (stuttgart-things/ai-personas, runner/run.sh moved into Tekton).
#
# Checks the scenario, then gets what one persona run needs and nothing more:
# a short-lived ZITADEL access token of the persona and, for scenarios with
# `capabilities: [ssh]`, a throwaway SSH key signed by the lab's Vault SSH CA
# (ai-personas ADR 0003). Both land on the `credentials` workspace for
# persona-run, which moves them into memory and wipes them from the volume.
#
# Vault is reached over its HTTP API with curl, in the runner image itself: no
# vault binary, no second image. The AppRole login gives a short-lived token
# that is revoked at the end. Nothing secret goes into argv (all bodies and
# headers via stdin/files), so nothing secret shows in a process listing.
#
# Separate pod on purpose: this task needs egress to Vault, the run must not
# have it. A NetworkPolicy on the persona-run pod can then allow only
# claim-machinery-api, the order service, ZITADEL and the Anthropic API.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: persona-credentials
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/categories: "testing"
    tekton.dev/tags: "ai-personas,vault,zitadel"
spec:
  description: >-
    Check an ai-personas scenario (merge: auto unless allowed otherwise), then
    fetch the persona's short-lived ZITADEL token and, for ssh scenarios, a
    Vault-signed throwaway SSH key onto the credentials workspace.
  workspaces:
    - name: credentials
      description: >-
        receives persona-token and, for ssh scenarios, ssh/id_ed25519 +
        ssh/id_ed25519-cert.pub. Bind a subPath of a volumeClaimTemplate, so it
        dies with the PipelineRun.
    - name: ca-certs
      optional: true
      mountPath: /etc/ssl/extra
      description: >-
        the lab's root CA as key `ca.pem` (ConfigMap or Secret), for Vault and
        ZITADEL. Same mount path the runner image's entrypoint expects.
  params:
    - name: PERSONA
      type: string
      description: persona name, e.g. developer (personas/<name> in the runner image)
    - name: SCENARIO
      type: string
      description: scenario name, e.g. verify-vm-ssh-auto (scenarios/<name>.yaml in the runner image)
    - name: LAB
      type: string
      description: lab name, e.g. labul; Vault path is <VAULT_KV_MOUNT>/<LAB>/<PERSONA>
    - name: ALLOW_HUMAN_MERGE
      type: string
      default: "false"
      description: >-
        "true" lets scenarios with merge: human through. Off by default: such a
        run waits for a person to merge the order's PR, and the pod would sit
        there for the whole wait.
    - name: VAULT_KV_MOUNT
      type: string
      default: "ai-personas"
      description: KV v2 mount holding token_url, client_id, client_secret, scope per persona
    - name: SSH_CA_MOUNT
      type: string
      default: "ssh-client-signer"
      description: Vault SSH CA mount; role persona-<PERSONA>, principal sthings
    - name: RUNNER_IMAGE
      type: string
      description: the ai-personas runner image (ai-personas/runner/Containerfile)
    - name: vault-secret-name
      type: string
      default: "vault-ai-personas-runner"
      description: >-
        Secret with VAULT_ADDR, VAULT_ROLE_ID, VAULT_SECRET_ID (optional
        VAULT_NAMESPACE). The AppRole's policy: read on
        <VAULT_KV_MOUNT>/data/<LAB>/*, update on <SSH_CA_MOUNT>/sign/persona-*.
  results:
    - name: run-id
      description: <utc yyyy-mm-ddThh-mm>-<persona>-<scenario>, the run's directory name
    - name: ssh
      description: '"true" when the scenario asks for ssh and a key was signed'
    - name: vault-addr
      description: >-
        the Vault this task used (not a secret); persona-run checks that its
        pod cannot reach it (egress check, ai-personas ADR 0006)
  stepTemplate:
    image: "$(params.RUNNER_IMAGE)"
    env:
      - name: PERSONA
        value: $(params.PERSONA)
      - name: SCENARIO
        value: $(params.SCENARIO)
      - name: LAB
        value: $(params.LAB)
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001   # the image's persona user; persona-run reads these files as it
      allowPrivilegeEscalation: false
    computeResources:
      requests:
        cpu: 50m
        memory: 64Mi
  steps:
    - name: check-scenario
      env:
        - name: ALLOW_HUMAN_MERGE
          value: $(params.ALLOW_HUMAN_MERGE)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        base=/opt/ai-personas
        pfile=$base/personas/$PERSONA/persona.yaml
        sfile=$base/scenarios/$SCENARIO.yaml
        [ -f "$pfile" ] || { echo "unknown persona: $PERSONA" >&2; exit 2; }
        [ -f "$sfile" ] || { echo "unknown scenario: $SCENARIO" >&2; exit 2; }

        merge=$(js-yaml "$sfile" | jq -r '.merge // "human"')
        if [ "$merge" != auto ] && [ "$ALLOW_HUMAN_MERGE" != true ]; then
          echo "scenario $SCENARIO has merge: $merge; this pipeline runs merge: auto scenarios" >&2
          echo "(a human merge holds the pod until someone merges; ALLOW_HUMAN_MERGE=true runs it anyway)" >&2
          exit 2
        fi

        ssh=false
        if js-yaml "$sfile" | jq -e '(.capabilities // []) | index("ssh")' >/dev/null; then ssh=true; fi
        printf '%s' "$ssh" > "$(results.ssh.path)"
        printf '%s' "$(date -u +%Y-%m-%dT%H-%M)-$PERSONA-$SCENARIO" > "$(results.run-id.path)"
        echo "persona $PERSONA, scenario $SCENARIO, lab $LAB, merge $merge, ssh $ssh"

    - name: fetch-credentials
      env:
        - name: CRED_DIR
          value: $(workspaces.credentials.path)
        - name: VAULT_KV_MOUNT
          value: $(params.VAULT_KV_MOUNT)
        - name: SSH_CA_MOUNT
          value: $(params.SSH_CA_MOUNT)
        - name: VAULT_ADDR
          valueFrom:
            secretKeyRef:
              name: $(params.vault-secret-name)
              key: VAULT_ADDR
        - name: VAULT_ROLE_ID
          valueFrom:
            secretKeyRef:
              name: $(params.vault-secret-name)
              key: VAULT_ROLE_ID
        - name: VAULT_SECRET_ID
          valueFrom:
            secretKeyRef:
              name: $(params.vault-secret-name)
              key: VAULT_SECRET_ID
        - name: VAULT_NAMESPACE
          valueFrom:
            secretKeyRef:
              name: $(params.vault-secret-name)
              key: VAULT_NAMESPACE
              optional: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        umask 077
        ssh=$(cat "$(results.ssh.path)")

        cacurl=()
        [ -s /etc/ssl/extra/ca.pem ] && cacurl=(--cacert /etc/ssl/extra/ca.pem)

        # Headers from a 0600 file (curl -H @file), so the Vault token is not
        # in argv.
        hdr=$(mktemp)
        [ -n "${VAULT_NAMESPACE:-}" ] && printf 'X-Vault-Namespace: %s\n' "$VAULT_NAMESPACE" >> "$hdr"
        vault_api() { curl -fsS "${cacurl[@]}" -H @"$hdr" "$@"; }

        # AppRole -> short-lived Vault token, revoked when this step ends.
        vtoken=$(jq -n '{role_id: env.VAULT_ROLE_ID, secret_id: env.VAULT_SECRET_ID}' \
          | vault_api -X POST --data @- "$VAULT_ADDR/v1/auth/approle/login" \
          | jq -r '.auth.client_token // empty')
        unset VAULT_ROLE_ID VAULT_SECRET_ID
        printf '%s' "$VAULT_ADDR" > "$(results.vault-addr.path)"
        [ -n "$vtoken" ] || { echo "vault approle login failed" >&2; exit 1; }
        printf 'X-Vault-Token: %s\n' "$vtoken" >> "$hdr"
        unset vtoken
        trap 'vault_api -X POST "$VAULT_ADDR/v1/auth/token/revoke-self" >/dev/null || true; rm -f "$hdr"' EXIT

        # Persona client credentials -> ZITADEL access token (client credentials
        # grant). The form body goes in on stdin, built by jq with @uri.
        creds=$(vault_api "$VAULT_ADDR/v1/$VAULT_KV_MOUNT/data/$LAB/$PERSONA" | jq -c .data.data)
        token_url=$(jq -r .token_url <<<"$creds")
        token=$(jq -r '"grant_type=client_credentials&client_id=\(.client_id|@uri)&client_secret=\(.client_secret|@uri)&scope=\(.scope|@uri)"' <<<"$creds" \
          | curl -fsS "${cacurl[@]}" --data @- "$token_url" | jq -r '.access_token // empty')
        unset creds
        [ -n "$token" ] || { echo "no token for persona $PERSONA" >&2; exit 1; }
        printf '%s' "$token" > "$CRED_DIR/persona-token"
        unset token
        echo "persona token written"

        # SSH (ai-personas ADR 0003): throwaway key, signed for the role's TTL
        # (30 min), only for scenarios that ask for it.
        if [ "$ssh" = true ]; then
          mkdir -p "$CRED_DIR/ssh"
          ssh-keygen -q -t ed25519 -N "" -C "persona-$PERSONA@$LAB" -f "$CRED_DIR/ssh/id_ed25519"
          jq -n --rawfile k "$CRED_DIR/ssh/id_ed25519.pub" '{public_key: $k, valid_principals: "sthings"}' \
            | vault_api -X POST --data @- "$VAULT_ADDR/v1/$SSH_CA_MOUNT/sign/persona-$PERSONA" \
            | jq -j '.data.signed_key // empty' > "$CRED_DIR/ssh/id_ed25519-cert.pub"
          [ -s "$CRED_DIR/ssh/id_ed25519-cert.pub" ] || { echo "ssh key not signed (role persona-$PERSONA on $SSH_CA_MOUNT?)" >&2; exit 1; }
          echo "ssh: $(ssh-keygen -L -f "$CRED_DIR/ssh/id_ed25519-cert.pub" | sed -n 's/^ *Valid: //p')"
        fi
