---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-packer-template
spec:
  workspaces:
    - name: shared-workspace
    - name: sshCredentials
      optional: true
    # Credentials for cloning the template repo over HTTPS (the default
    # gitRepoUrl is a private repo, and an ssh-directory cannot authenticate
    # an https:// remote). Expects a secret with .gitconfig / .git-credentials
    # as produced by templates/git-basicauth-secret.yaml.
    - name: basicAuth
      optional: true
    - name: caCerts
      optional: true
  params:
    - name: packerAction
      type: string
      default: "build"
      description: packer action to perform (init, validate or build)
    - name: packerTemplate
      type: string
      default: "."
      description: packer template file or directory to act on (relative to working dir)
    - name: packerOnly
      type: string
      default: ""
      description: comma-separated build sources to restrict the build to (packer -only)
    - name: packerForce
      type: string
      default: "false"
      description: force a build, overwriting any existing artifacts (packer -force)
    - name: packerRunInit
      type: string
      default: "true"
      description: run "packer init" before validate/build to install required plugins
    - name: packerVars
      type: array
      default: []
      description: extra variables, array of key+-value (written to tekton.auto.pkrvars.hcl)
    - name: packerVarsFile
      type: string
      default: ""
      description: pkrvars file as b64 (merged via *.auto.pkrvars.hcl, takes precedence over packerVars)
    - name: packerInitExtraArgs
      type: string
      default: ""
      description: extra arguments passed to packer init
    - name: packerBuildExtraArgs
      type: string
      default: ""
      description: extra arguments passed to packer validate/build
    - name: packerLog
      type: string
      default: ""
      description: enable packer debug logging (1 to enable, empty to disable)
    - name: packerWorkingImage
      type: string
      default: "ghcr.io/stuttgart-things/sthings-packer:2.0.0"
      description: the image on which packer will run
    - name: credentialsSecretName
      type: string
      default: "packer-credentials"
      description: name of the secret whose keys are injected as env vars (builder credentials)
    - name: vaultSecretName
      type: string
      default: "vault"
      description: name of the vault secret
    - name: userHome
      type: string
      default: "/home/nonroot"
      description: absolute path to the user's home directory
    - name: gitRepoUrl
      type: string
      default: ""
      description: source git repo (holds the packer templates)
    - name: gitRevision
      type: string
      default: "main"
      description: revision of source git repo
    - name: templateLookupVaultPath
      type: string
      default: ""
      description: >-
        vSphere only: Vault KV v2 path with the vCenter credentials (keys
        username/password/ip), normally the path the packer template reads
        with vault(), e.g. cloud/data/vsphere-labda. Set, execute-packer reads
        the built template's config.uuid with govc into the template-uuid
        result. Empty = no lookup (template-uuid stays empty)
    - name: templateLookupInsecure
      type: string
      default: "false"
      description: '"true" skips vCenter TLS verification for the template-uuid lookup'
    - name: gitWorkspaceSubdirectory
      type: string
      default: ""
      description: >-
        path INSIDE the template repo holding the *.pkr.hcl (e.g.
        packer/builds/ubuntu24-labul-vsphere-base-os). Empty => repo root.
        This is not a workspace-placement path; the repo is always cloned to
        the workspace root.
  results:
    - name: template-name
      description: name of the template/artifact produced by the build
      value: $(tasks.execute-packer.results.template-name)
    - name: template-display-name
      description: >-
        the template's name as the hypervisor shows it. Equals template-name on
        vsphere-iso; on proxmox-iso, where template-name is the VMID, it is the
        template_name the build wrote to packer-manifest.json
      value: $(tasks.execute-packer.results.template-display-name)
    - name: template-uuid
      description: >-
        vsphere-iso only: config.uuid (BIOS UUID) of the built template, what
        NativeVsphereVM clones by. Empty on Proxmox, without
        templateLookupVaultPath, or when the lookup failed (a warning, never
        a build failure)
      value: $(tasks.execute-packer.results.template-uuid)
  tasks:
    - name: fetch-repository
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/tektoncd/catalog.git
          # Pinned to a fixed commit for reproducibility/supply-chain safety
          # (external dependency). tektoncd/catalog main @ 2026-06; bump
          # deliberately.
          - name: revision
            value: 7ea2968e224633b4967d60217b33bb4d38fa53d9 # pragma: allowlist secret (git commit SHA, not a secret)
          - name: pathInRepo
            value: task/git-clone/0.10/git-clone.yaml
      workspaces:
        - name: output
          workspace: shared-workspace
        - name: ssh-directory
          workspace: sshCredentials
        - name: basic-auth
          workspace: basicAuth
      params:
        - name: deleteExisting
          value: 'true'
        - name: revision
          value: $(params.gitRevision)
        # NOTE: gitWorkspaceSubdirectory is deliberately NOT passed as
        # git-clone's `subdirectory`. It is a REPO-RELATIVE path (where the
        # *.pkr.hcl live inside the template repo, e.g.
        # packer/builds/<os>-<lab>-<hypervisor>-<provisioning>) and is applied
        # by execute-packer as SUB_DIRECTORY. Passing it here too nested the
        # clone under the same path, so the packer working dir landed on the
        # repo ROOT and every real build failed with
        # "Could not find any config file in .".
        - name: url
          value: $(params.gitRepoUrl)
    - name: execute-packer
      runAfter:
        - fetch-repository
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/stuttgart-things/stage-time.git
          - name: revision
            value: v0.13.7
          - name: pathInRepo
            value: tasks/execute-packer.yaml
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: ca-certs
          workspace: caCerts
      params:
        - name: ACTION
          value: $(params.packerAction)
        - name: TEMPLATE
          value: $(params.packerTemplate)
        - name: ONLY
          value: $(params.packerOnly)
        - name: FORCE
          value: $(params.packerForce)
        - name: RUN_INIT
          value: $(params.packerRunInit)
        - name: PKR_VARS
          value: $(params.packerVars[*])
        - name: PKR_VARS_FILE
          value: $(params.packerVarsFile)
        - name: INIT_EXTRA_ARGS
          value: $(params.packerInitExtraArgs)
        - name: BUILD_EXTRA_ARGS
          value: $(params.packerBuildExtraArgs)
        - name: PACKER_LOG
          value: $(params.packerLog)
        - name: WORKING_IMAGE
          value: $(params.packerWorkingImage)
        - name: SUB_DIRECTORY
          value: $(params.gitWorkspaceSubdirectory)
        - name: USER_HOME
          value: $(params.userHome)
        - name: credentials-secret-name
          value: $(params.credentialsSecretName)
        - name: vault-secret-name
          value: $(params.vaultSecretName)
        - name: TEMPLATE_LOOKUP_VAULT_PATH
          value: $(params.templateLookupVaultPath)
        - name: TEMPLATE_LOOKUP_INSECURE
          value: $(params.templateLookupInsecure)
