---
name: Task tests
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - tasks/execute-govc.yaml
      - tests/execute-govc/**
      - .github/workflows/task-tests.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  execute-govc:
    name: execute-govc promote (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # yq (mikefarah) is preinstalled on ubuntu-latest; the test extracts the
      # task's step script with it and runs it against a stubbed govc/Vault.
      - name: Run promote cases
        run: tests/execute-govc/test-promote.sh
